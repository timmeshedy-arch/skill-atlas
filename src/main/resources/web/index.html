<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Atlas</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #37352f;
    --muted: #787774;
    --faint: #9b9a97;
    --border: #e9e9e7;
    --hover: #f7f7f5;
    --input: #fbfbfa;
    --accent: #2383e2;
    --accent-hover: #0f6fca;
    --ok-bg: #dbeddb;   --ok-fg: #1c3829;
    --bad-bg: #ffe2dd;  --bad-fg: #5d1715;
    --warn-bg: #fdecc8; --warn-fg: #402c1b;
    --code-bg: rgba(135, 131, 120, .15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919;
      --text: #d4d4d4;
      --muted: #9b9b9b;
      --faint: #7f7f7f;
      --border: #2f2f2f;
      --hover: #252525;
      --input: #202020;
      --ok-bg: #2b593f;   --ok-fg: #d8f0e0;
      --bad-bg: #6e3630;  --bad-fg: #ffe2dd;
      --warn-bg: #59441f; --warn-fg: #fdecc8;
      --code-bg: rgba(135, 131, 120, .25);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 760px; margin: 0 auto; padding: 72px 16px 96px; }

  .icon { font-size: 56px; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 36px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
  .subtitle { color: var(--muted); margin: 0 0 32px; }

  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input {
    font: inherit;
    color: inherit;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--faint); }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(35, 131, 226, .15); }
  #repo { flex: 1 1 320px; min-width: 0; }
  #filter { display: block; width: 100%; margin-top: 24px; }
  button {
    font: inherit;
    font-weight: 500;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    padding: 7px 16px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: default; }
  button.secondary { color: var(--text); background: var(--hover); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--border); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 13px;
    padding: 2px 4px 2px 8px;
    border-radius: 4px;
    background: var(--code-bg);
  }
  .chip button {
    color: var(--muted); background: none;
    padding: 0 4px; font-size: 14px; line-height: 1;
  }
  .chip button:hover { color: var(--text); background: none; }
  .hint { color: var(--faint); font-size: 13px; margin-top: 6px; min-height: 1.5em; }

  .callout {
    display: flex; gap: 10px;
    margin-top: 24px;
    padding: 12px 16px;
    border-radius: 6px;
    background: var(--hover);
  }
  .callout.error { background: var(--bad-bg); color: var(--bad-fg); }
  .callout.warn { background: var(--warn-bg); color: var(--warn-fg); }

  .meta {
    margin-top: 40px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px;
  }
  .meta .line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .repo-label { font-size: 12px; color: var(--muted); }
  .meta a { color: inherit; }
  code {
    font: 85% ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--code-bg);
    color: #eb5757;
    border-radius: 4px;
    padding: 1px 4px;
  }

  h2 {
    font-size: 14px; font-weight: 600;
    color: var(--muted);
    margin: 32px 0 4px;
    display: flex; align-items: center; gap: 6px;
  }
  h2 .count { color: var(--faint); font-weight: 400; }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    padding: 10px 8px;
    margin: 0 -8px;
    border-radius: 6px;
    transition: background .1s;
  }
  li:hover { background: var(--hover); }
  li + li { border-top: 1px solid var(--border); }
  li:hover + li, li:hover { border-top-color: transparent; }
  .row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name { font-weight: 600; }
  .name.missing { color: var(--faint); font-weight: 400; font-style: italic; }
  .tag {
    font-size: 12px;
    padding: 0 6px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .tag.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .tag.bad { background: var(--bad-bg); color: var(--bad-fg); }
  .tag.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .desc {
    margin: 2px 0 0;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
    cursor: pointer;
  }
  .desc.open { -webkit-line-clamp: unset; }
  .path {
    display: inline-block;
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    word-break: break-all;
  }
  .path:hover { color: var(--text); text-decoration: underline; }
  .empty { color: var(--faint); padding: 8px 0; font-size: 14px; }
  .similar .member { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .similar .member .path { margin-top: 0; }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--muted);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex: none; align-self: center;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="icon">🗺️</div>
  <h1>Skill Atlas</h1>
  <p class="subtitle">Claude Code skills and slash commands defined in GitHub repositories.</p>

  <form id="form" autocomplete="off">
    <button id="scan" type="submit">Scan</button>
    <input id="repo" name="repo" placeholder="owner/repo or https://github.com/owner/repo" autofocus>
    <button id="add" type="button" class="secondary">Add</button>
  </form>
  <div id="chips" class="chips"></div>
  <div id="hint" class="hint"></div>

  <div id="status" class="callout" hidden></div>
  <input id="filter" type="search" placeholder="Filter by name" aria-label="Filter by name" autocomplete="off" hidden>
  <section id="result" hidden></section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const form = $("form"), repoInput = $("repo"), addButton = $("add");
  const button = $("scan"), statusBox = $("status"), result = $("result");
  const filterInput = $("filter"), chipsBox = $("chips"), hint = $("hint");
  const MAX_REPOS = 10;
  let repos = [], scanning = false, lastData = null, groupsBox = null;

  const GROUPS = [
    { type: "SKILL", title: "Skills" },
    { type: "COMMAND", title: "Commands" },
  ];

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    node.append(...children.filter((c) => c != null));
    return node;
  }

  function showStatus(kind, ...content) {
    statusBox.className = "callout" + (kind ? " " + kind : "");
    statusBox.replaceChildren(...content);
    statusBox.hidden = false;
  }

  // Same forms as the CLI <repo> argument (see RepoArg.kt); returns "owner/repo" or null.
  function parseRepo(input) {
    const s = input.trim().replace(/\.git$/, "").replace(/\/$/, "")
      .replace(/^(https?:\/\/|git@)/, "").replace(/^github\.com[\/:]/, "");
    const parts = s.split("/").filter((p) => p.trim());
    return parts.length >= 2 ? `${parts[0]}/${parts[1]}` : null;
  }

  function renderChips() {
    chipsBox.replaceChildren(...repos.map((r) => el("span", { className: "chip" },
      r,
      el("button", { type: "button", title: `Remove ${r}`, textContent: "×", onclick: () => removeRepo(r) }),
    )));
    button.disabled = scanning || (!repos.length && !repoInput.value.trim());
  }

  // Adds the input value to the list; returns false (with a hint) if it can't be added.
  function addRepo(input) {
    const repo = parseRepo(input);
    if (!repo) { hint.textContent = `Can't parse "${input.trim()}" as owner/repo.`; return false; }
    if (repos.some((r) => r.toLowerCase() === repo.toLowerCase())) { hint.textContent = `${repo} is already added.`; return false; }
    if (repos.length >= MAX_REPOS) { hint.textContent = `At most ${MAX_REPOS} repositories.`; return false; }
    repos.push(repo);
    hint.textContent = "";
    renderChips();
    return true;
  }

  function removeRepo(repo) {
    repos = repos.filter((r) => r !== repo);
    hint.textContent = "";
    renderChips();
  }

  function addFromInput() {
    const value = repoInput.value.trim();
    if (value && addRepo(value)) repoInput.value = "";
    renderChips();
    repoInput.focus();
  }

  const artifactKey = (x) => `${x.owner}/${x.repo}/${x.path}`;

  function renderArtifact(a) {
    const name = a.name
      ? el("span", { className: "name", textContent: a.name })
      : el("span", { className: "name missing", textContent: "unnamed" });
    const tag = a.valid
      ? el("span", { className: "tag ok", textContent: "valid" })
      : el("span", { className: "tag bad", textContent: a.error || "invalid" });
    return el("li", {},
      el("div", { className: "row" }, name, tag, el("span", { className: "repo-label", textContent: `${a.owner}/${a.repo}` })),
      a.description ? el("p", {
        className: "desc",
        textContent: a.description,
        title: "Click to expand",
        onclick: (e) => e.currentTarget.classList.toggle("open"),
      }) : null,
      el("a", { className: "path", href: a.url, target: "_blank", rel: "noopener", textContent: a.path }),
    );
  }

  // Case-insensitive substring match on name; commands are compared without the leading "/".
  function matches(a, q) {
    if (!q) return true;
    if (!a.name) return false;
    const name = a.type === "COMMAND" ? a.name.replace(/^\//, "") : a.name;
    return name.toLowerCase().includes(q.replace(/^\//, "").toLowerCase());
  }

  function renderGroups() {
    const q = filterInput.value.trim();
    const nodes = [];
    for (const g of GROUPS) {
      const all = lastData.artifacts.filter((a) => a.type === g.type);
      const items = all.filter((a) => matches(a, q));
      const count = q ? `${items.length} / ${all.length}` : all.length;
      nodes.push(el("h2", {}, g.title, el("span", { className: "count", textContent: count })));
      nodes.push(items.length
        ? el("ul", {}, ...items.map(renderArtifact))
        : el("div", { className: "empty", textContent: all.length ? "No matches." : `No ${g.title.toLowerCase()} found.` }));
    }
    groupsBox.replaceChildren(...nodes);
  }

  function syncFilterToUrl() {
    const params = new URLSearchParams(location.search);
    const q = filterInput.value.trim();
    if (q) params.set("q", q); else params.delete("q");
    history.replaceState(null, "", "?" + params);
  }

  function renderRepoLine(r) {
    const name = `${r.owner}/${r.repo}`;
    if (r.error) {
      return el("div", { className: "line" },
        el("span", { textContent: name }),
        el("span", { className: "tag bad", textContent: r.error }),
      );
    }
    return el("div", { className: "line" },
      el("a", { href: `https://github.com/${name}/tree/${r.sha}`, target: "_blank", rel: "noopener", textContent: name }),
      el("span", {}, "@ ", el("code", { textContent: r.ref })),
      el("span", { textContent: r.sha.slice(0, 7) }),
    );
  }

  function render(data) {
    const total = data.artifacts.length;
    const valid = data.artifacts.filter((a) => a.valid).length;

    const nodes = [
      el("div", { className: "meta" },
        ...data.repos.map(renderRepoLine),
        el("div", { className: "line", textContent: `${total} found · ${valid} valid · ${total - valid} invalid` }),
      ),
    ];

    lastData = data;
    groupsBox = el("div");
    nodes.push(groupsBox);
    renderGroups();

    if (data.similar && data.similar.length) {
      const byKey = new Map(data.artifacts.map((a) => [artifactKey(a), a]));
      nodes.push(el("h2", {}, "Possibly similar", el("span", { className: "count", textContent: data.similar.length })));
      nodes.push(el("ul", { className: "similar" }, ...data.similar.map((g) => el("li", {},
        el("div", { className: "row" }, el("span", { className: "tag warn", textContent: `≈ ${g.score.toFixed(2)}` })),
        ...g.members.map((m) => {
          const a = byKey.get(artifactKey(m));
          return el("div", { className: "member" },
            el("span", { className: "name", textContent: a.name }),
            el("span", { className: "repo-label", textContent: `${m.owner}/${m.repo}` }),
            el("a", { className: "path", href: a.url, target: "_blank", rel: "noopener", textContent: m.path }),
          );
        }),
      ))));
    }

    result.replaceChildren(...nodes);
    result.hidden = false;
    filterInput.hidden = false;

    const truncated = data.repos.filter((r) => r.truncated).map((r) => `${r.owner}/${r.repo}`);
    if (truncated.length) {
      showStatus("warn", "⚠️", el("span", { textContent: `GitHub truncated the file tree of ${truncated.join(", ")} — results may be incomplete.` }));
    } else {
      statusBox.hidden = true;
    }
  }

  async function scan() {
    scanning = true;
    button.disabled = addButton.disabled = true;
    result.hidden = true;
    const label = repos.length === 1 ? repos[0] : `${repos.length} repositories`;
    showStatus("", el("div", { className: "spinner" }), el("span", { textContent: `Scanning ${label}…` }));

    const params = new URLSearchParams(repos.map((r) => ["repo", r]));
    history.replaceState(null, "", "?" + params);
    syncFilterToUrl();
    try { localStorage.setItem("skill-atlas:last", JSON.stringify({ repos })); } catch {}

    try {
      const res = await fetch("api/multi-scan?" + params);
      const body = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      render(body);
    } catch (e) {
      showStatus("error", "⛔", el("span", { textContent: e.message }));
    } finally {
      scanning = false;
      addButton.disabled = false;
      renderChips();
    }
  }

  // Enter with text in the field adds it; Enter on an empty field submits the form (scan).
  repoInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && repoInput.value.trim()) { e.preventDefault(); addFromInput(); }
  });
  // Scan: text left in the field is added to the list first.
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const value = repoInput.value.trim();
    if (value && !addRepo(value)) return;
    repoInput.value = "";
    renderChips();
    if (repos.length) scan();
  });
  addButton.addEventListener("click", addFromInput);
  repoInput.addEventListener("input", renderChips);

  filterInput.addEventListener("input", () => {
    syncFilterToUrl();
    if (lastData) renderGroups();
  });

  // Prefill from ?repo=a&repo=b&q= (shareable link) or the last scan.
  const qs = new URLSearchParams(location.search);
  filterInput.value = qs.get("q") || "";
  if (qs.getAll("repo").length) {
    qs.getAll("repo").forEach(addRepo);
    if (repos.length) scan();
  } else {
    try {
      const last = JSON.parse(localStorage.getItem("skill-atlas:last") || "null");
      // Before multi-repo the last scan was stored as { repo, ref }.
      (last?.repos || (last?.repo ? [last.repo] : [])).forEach(addRepo);
    } catch {}
  }
  renderChips();
</script>
</body>
</html>
