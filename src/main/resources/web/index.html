<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Atlas</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #37352f;
    --muted: #787774;
    --faint: #9b9a97;
    --border: #e9e9e7;
    --hover: #f7f7f5;
    --input: #fbfbfa;
    --accent: #2383e2;
    --accent-hover: #0f6fca;
    --ok-bg: #dbeddb;   --ok-fg: #1c3829;
    --bad-bg: #ffe2dd;  --bad-fg: #5d1715;
    --warn-bg: #fdecc8; --warn-fg: #402c1b;
    --code-bg: rgba(135, 131, 120, .15);
    --star: #e0a800;
    --selected: rgba(35, 131, 226, .1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919;
      --text: #d4d4d4;
      --muted: #9b9b9b;
      --faint: #7f7f7f;
      --border: #2f2f2f;
      --hover: #252525;
      --input: #202020;
      --ok-bg: #2b593f;   --ok-fg: #d8f0e0;
      --bad-bg: #6e3630;  --bad-fg: #ffe2dd;
      --warn-bg: #59441f; --warn-fg: #fdecc8;
      --code-bg: rgba(135, 131, 120, .25);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 760px; margin: 0 auto; padding: 72px 16px 96px; }

  .icon { font-size: 56px; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 36px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
  .subtitle { color: var(--muted); margin: 0 0 32px; }

  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input {
    font: inherit;
    color: inherit;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--faint); }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(35, 131, 226, .15); }
  #org { flex: 1 1 320px; min-width: 0; }
  .filters { display: flex; gap: 8px; margin-top: 24px; }
  .filters input { flex: 1 1 auto; min-width: 0; }
  button {
    font: inherit;
    font-weight: 500;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    padding: 7px 16px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: default; }
  button.secondary { color: var(--text); background: var(--hover); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--border); }
  button.secondary[aria-pressed="true"] { color: var(--star); border-color: var(--star); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 13px;
    padding: 2px 4px 2px 8px;
    border-radius: 4px;
    background: var(--code-bg);
  }
  .chip button {
    color: var(--muted); background: none;
    padding: 0 4px; font-size: 14px; line-height: 1;
  }
  .chip button:hover { color: var(--text); background: none; }
  .hint { color: var(--faint); font-size: 13px; margin-top: 6px; min-height: 1.5em; }

  .callout {
    display: flex; gap: 10px;
    margin-top: 24px;
    padding: 12px 16px;
    border-radius: 6px;
    background: var(--hover);
  }
  .callout.error { background: var(--bad-bg); color: var(--bad-fg); }
  .callout.warn { background: var(--warn-bg); color: var(--warn-fg); }

  .meta {
    margin-top: 40px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px;
  }
  .meta .line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .repo-label { font-size: 12px; color: var(--muted); }
  .meta a { color: inherit; }
  code {
    font: 85% ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--code-bg);
    color: #eb5757;
    border-radius: 4px;
    padding: 1px 4px;
  }

  h2 {
    font-size: 14px; font-weight: 600;
    color: var(--muted);
    margin: 32px 0 4px;
    display: flex; align-items: center; gap: 6px;
  }
  h2 .count { color: var(--faint); font-weight: 400; }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    padding: 10px 8px;
    margin: 0 -8px;
    border-radius: 6px;
    transition: background .1s;
  }
  li:hover { background: var(--hover); }
  li + li { border-top: 1px solid var(--border); }
  li:hover + li, li:hover { border-top-color: transparent; }
  li.item { cursor: pointer; }
  li.item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  li.item.selected { background: var(--selected); }
  li.item.selected + li, li.item.selected { border-top-color: transparent; }
  .row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name { font-weight: 600; }
  .name.missing { color: var(--faint); font-weight: 400; font-style: italic; }
  button.star {
    color: var(--faint); background: none;
    padding: 0; font-size: 16px; line-height: 1;
    align-self: center;
  }
  button.star:hover { color: var(--text); background: none; }
  button.star.on, button.star.on:hover { color: var(--star); }
  .tag {
    font-size: 12px;
    padding: 0 6px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .tag.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .tag.bad { background: var(--bad-bg); color: var(--bad-fg); }
  .tag.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .path {
    display: inline-block;
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    word-break: break-all;
  }
  .path:hover { color: var(--text); text-decoration: underline; }
  .empty { color: var(--faint); padding: 8px 0; font-size: 14px; }
  .similar .member { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .similar .member .path { margin-top: 0; }
  button.link { color: inherit; background: none; padding: 0; text-align: left; }
  button.link:hover { background: none; text-decoration: underline; }

  /* Details of the clicked artifact, docked to the right edge. */
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(420px, 100vw);
    overflow-y: auto;
    padding: 20px 24px 48px;
    background: var(--bg);
    border-left: 1px solid var(--border);
    box-shadow: -8px 0 24px rgba(15, 15, 15, .08);
  }
  .panel-top { display: flex; align-items: center; justify-content: space-between; }
  .panel .kind { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  button.close { color: var(--muted); background: none; padding: 0 4px; font-size: 22px; line-height: 1; }
  button.close:hover { color: var(--text); background: none; }
  .panel .title { margin: 8px 0 6px; font-size: 22px; overflow-wrap: anywhere; }
  .panel .title button.star { font-size: 20px; }
  .panel .field { margin-top: 20px; }
  .panel .label { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .panel .text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .panel .none { color: var(--faint); font-style: italic; }
  .panel .field a { color: inherit; }
  .panel .path { margin-top: 0; }
  /* Wide enough for both: the page moves left instead of hiding under the panel. */
  @media (min-width: 1240px) {
    body.panel-open main { margin-left: max(16px, calc((100vw - 420px - 760px) / 2)); }
  }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--muted);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex: none; align-self: center;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="icon">🗺️</div>
  <h1>Skill Atlas</h1>
  <p class="subtitle">Claude Code skills and slash commands defined across the repositories of GitHub organizations.</p>

  <form id="form" autocomplete="off">
    <input id="org" name="org" placeholder="organization or https://github.com/organization" autofocus>
    <button id="add" type="button" class="secondary">Add</button>
    <button id="scan" type="submit">Scan</button>
  </form>
  <div id="chips" class="chips"></div>
  <div id="hint" class="hint"></div>

  <div id="status" class="callout" hidden></div>
  <div id="filters" class="filters" hidden>
    <input id="filter" type="search" placeholder="Filter by name" aria-label="Filter by name" autocomplete="off">
    <button id="starred" type="button" class="secondary" aria-pressed="false" title="Show only starred">★ Starred</button>
  </div>
  <section id="result" hidden></section>
</main>
<aside id="panel" class="panel" aria-label="Details" hidden></aside>

<script>
  const $ = (id) => document.getElementById(id);
  const form = $("form"), orgInput = $("org"), addButton = $("add");
  const button = $("scan"), statusBox = $("status"), result = $("result");
  const filterInput = $("filter"), chipsBox = $("chips"), hint = $("hint");
  const filtersBox = $("filters"), starredButton = $("starred"), panel = $("panel");
  const MAX_ORGS = 5, PAGE_SIZE = 100;
  let orgs = [], scanning = false, lastData = null, groupsBox = null;
  // Stars live on the server (/api/stars); keys are starKey() of the starred artifacts.
  let stars = new Set(), starredOnly = false;
  // Artifact shown in the side panel, or null.
  let selected = null;

  const GROUPS = [
    { type: "SKILL", title: "Skills" },
    { type: "COMMAND", title: "Commands" },
  ];

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    node.append(...children.filter((c) => c != null));
    return node;
  }

  function showStatus(kind, ...content) {
    statusBox.className = "callout" + (kind ? " " + kind : "");
    statusBox.replaceChildren(...content);
    statusBox.hidden = false;
  }

  // Same forms as parseOrg in RepoArg.kt: "org", "@org", "https://github.com/org"; returns the login or null.
  function parseOrg(input) {
    const s = input.trim().replace(/\/$/, "")
      .replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/^github\.com\//, "").replace(/^@/, "");
    return /^[A-Za-z0-9][A-Za-z0-9-]{0,38}$/.test(s) ? s : null;
  }

  function renderChips() {
    chipsBox.replaceChildren(...orgs.map((o) => el("span", { className: "chip" },
      o,
      el("button", { type: "button", title: `Remove ${o}`, textContent: "×", onclick: () => removeOrg(o) }),
    )));
    button.disabled = scanning || (!orgs.length && !orgInput.value.trim());
  }

  // Adds the input value to the list; returns false (with a hint) if it can't be added.
  function addOrg(input) {
    const org = parseOrg(input);
    if (!org) { hint.textContent = `Can't parse "${input.trim()}" as an organization.`; return false; }
    if (orgs.some((o) => o.toLowerCase() === org.toLowerCase())) { hint.textContent = `${org} is already added.`; return false; }
    if (orgs.length >= MAX_ORGS) { hint.textContent = `At most ${MAX_ORGS} organizations.`; return false; }
    orgs.push(org);
    hint.textContent = "";
    renderChips();
    return true;
  }

  function removeOrg(org) {
    orgs = orgs.filter((o) => o !== org);
    hint.textContent = "";
    renderChips();
  }

  function addFromInput() {
    const value = orgInput.value.trim();
    if (value && addOrg(value)) orgInput.value = "";
    renderChips();
    orgInput.focus();
  }

  const artifactKey = (x) => `${x.owner}/${x.repo}/${x.path}`;
  // GitHub owner/repo are case-insensitive, the path is not (same rule as the server).
  const starKey = (x) => `${x.owner}/${x.repo}`.toLowerCase() + "/" + x.path;

  function setStars(body) { stars = new Set(body.stars.map(starKey)); }

  async function loadStars() {
    try {
      const res = await fetch("api/stars");
      if (res.ok) setStars(await res.json());
    } catch {}
    if (lastData) renderGroups();
    renderPanel();
  }

  function paintStar(btn, a) {
    const on = stars.has(starKey(a));
    const what = a.name || a.path;
    btn.classList.toggle("on", on);
    btn.textContent = on ? "★" : "☆";
    btn.title = on ? "Unstar" : "Star";
    btn.setAttribute("aria-label", `${on ? "Unstar" : "Star"} ${what}`);
    btn.setAttribute("aria-pressed", String(on));
  }

  // Every star on the page, so the list and the panel stay in sync.
  function paintStars() {
    document.querySelectorAll("button.star").forEach((b) => paintStar(b, b.artifact));
  }

  function starButton(a) {
    const btn = el("button", { type: "button", className: "star", artifact: a });
    btn.onclick = () => toggleStar(a);
    paintStar(btn, a);
    return btn;
  }

  // Optimistic: the star flips at once and is rolled back if the server rejects the change.
  async function toggleStar(a) {
    const key = starKey(a), on = !stars.has(key);
    const refresh = () => { if (starredOnly) renderGroups(); paintStars(); };
    if (on) stars.add(key); else stars.delete(key);
    refresh();
    try {
      const params = new URLSearchParams({ owner: a.owner, repo: a.repo, path: a.path });
      const res = await fetch("api/stars?" + params, { method: on ? "PUT" : "DELETE" });
      const body = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      setStars(body);
    } catch (e) {
      if (on) stars.delete(key); else stars.add(key);
      showStatus("error", "⛔", el("span", { textContent: `Could not ${on ? "star" : "unstar"} ${a.name || a.path}: ${e.message}` }));
    }
    refresh();
  }

  function nameOf(a) {
    return a.name
      ? el("span", { className: "name", textContent: a.name })
      : el("span", { className: "name missing", textContent: "unnamed" });
  }

  function statusOf(a) {
    return a.valid
      ? el("span", { className: "tag ok", textContent: "valid" })
      : el("span", { className: "tag bad", textContent: a.error || "invalid" });
  }

  // Description and permalink are not in the row: a click opens them in the side panel.
  function renderArtifact(a) {
    const li = el("li", { className: "item", tabIndex: 0, artifact: a },
      el("div", { className: "row" }, starButton(a), nameOf(a), statusOf(a), el("span", { className: "repo-label", textContent: `${a.owner}/${a.repo}` })),
    );
    li.onclick = (e) => { if (!e.target.closest("button, a")) select(a); };
    li.onkeydown = (e) => { if (e.key === "Enter" && e.target === li) select(a); };
    return li;
  }

  const isSelected = (a) => selected != null && artifactKey(a) === artifactKey(selected);

  // Clicking the artifact that is already open closes the panel.
  function select(a) {
    selected = a && !isSelected(a) ? a : null;
    paintSelection();
    renderPanel();
  }

  function paintSelection() {
    document.querySelectorAll("li.item").forEach((li) => li.classList.toggle("selected", isSelected(li.artifact)));
  }

  function field(label, value) {
    return el("div", { className: "field" }, el("div", { className: "label", textContent: label }), value);
  }

  function renderPanel() {
    document.body.classList.toggle("panel-open", selected != null);
    panel.hidden = selected == null;
    if (!selected) { panel.replaceChildren(); return; }
    const a = selected;
    panel.replaceChildren(
      el("div", { className: "panel-top" },
        el("span", { className: "kind", textContent: a.type === "COMMAND" ? "Command" : "Skill" }),
        el("button", { type: "button", className: "close", title: "Close", textContent: "×", onclick: () => select(null) }),
      ),
      el("div", { className: "row title" }, starButton(a), nameOf(a)),
      el("div", { className: "row" }, statusOf(a)),
      field("Repository", el("a", { href: `https://github.com/${a.owner}/${a.repo}`, target: "_blank", rel: "noopener", textContent: `${a.owner}/${a.repo}` })),
      field("Description", a.description
        ? el("p", { className: "text", textContent: a.description })
        : el("span", { className: "none", textContent: "No description" })),
      field("File", el("a", { className: "path", href: a.url, target: "_blank", rel: "noopener", textContent: a.path })),
    );
  }

  // Case-insensitive substring match on name; commands are compared without the leading "/".
  function matches(a, q) {
    if (!q) return true;
    if (!a.name) return false;
    const name = a.type === "COMMAND" ? a.name.replace(/^\//, "") : a.name;
    return name.toLowerCase().includes(q.replace(/^\//, "").toLowerCase());
  }

  function emptyText(g, all, q) {
    if (!all.length) return `No ${g.title.toLowerCase()} found.`;
    return starredOnly && !q ? "No starred items." : "No matches.";
  }

  function renderGroups() {
    const q = filterInput.value.trim();
    const nodes = [];
    for (const g of GROUPS) {
      const all = lastData.artifacts.filter((a) => a.type === g.type);
      const items = all.filter((a) => matches(a, q) && (!starredOnly || stars.has(starKey(a))));
      const count = q || starredOnly ? `${items.length} / ${all.length}` : all.length;
      nodes.push(el("h2", {}, g.title, el("span", { className: "count", textContent: count })));
      nodes.push(items.length
        ? el("ul", {}, ...items.map(renderArtifact))
        : el("div", { className: "empty", textContent: emptyText(g, all, q) }));
    }
    groupsBox.replaceChildren(...nodes);
    paintSelection();
  }

  function setStarredOnly(on) {
    starredOnly = on;
    starredButton.setAttribute("aria-pressed", String(on));
  }

  function syncFilterToUrl() {
    const params = new URLSearchParams(location.search);
    const q = filterInput.value.trim();
    if (q) params.set("q", q); else params.delete("q");
    if (starredOnly) params.set("starred", "1"); else params.delete("starred");
    history.replaceState(null, "", "?" + params);
  }

  function renderOrgLine(o) {
    const link = el("a", { href: `https://github.com/${o.org}`, target: "_blank", rel: "noopener", textContent: o.org });
    if (o.error) {
      return el("div", { className: "line" }, link, el("span", { className: "tag bad", textContent: o.error }));
    }
    return el("div", { className: "line" },
      link,
      el("span", { textContent: `${o.repos} ${o.repos === 1 ? "repository" : "repositories"}` }),
      o.truncated ? el("span", { className: "tag warn", textContent: "most recently pushed only" }) : null,
    );
  }

  // Only failed repos get a line: an organization can have a hundred of them.
  function renderRepoError(r) {
    return el("div", { className: "line" },
      el("span", { textContent: `${r.owner}/${r.repo}` }),
      el("span", { className: "tag bad", textContent: r.error }),
    );
  }

  function render(data) {
    const total = data.artifacts.length;
    const valid = data.artifacts.filter((a) => a.valid).length;

    const nodes = [
      el("div", { className: "meta" },
        ...data.orgs.map(renderOrgLine),
        ...data.repos.filter((r) => r.error).map(renderRepoError),
        el("div", { className: "line", textContent: `${total} found · ${valid} valid · ${total - valid} invalid` }),
      ),
    ];

    lastData = data;
    // A rescan keeps the panel open if the artifact is still there.
    selected = selected && data.artifacts.find(isSelected) || null;
    groupsBox = el("div");
    nodes.push(groupsBox);
    renderGroups();

    if (data.similar && data.similar.length) {
      const byKey = new Map(data.artifacts.map((a) => [artifactKey(a), a]));
      nodes.push(el("h2", {}, "Possibly similar", el("span", { className: "count", textContent: data.similar.length })));
      nodes.push(el("ul", { className: "similar" }, ...data.similar.map((g) => el("li", {},
        el("div", { className: "row" }, el("span", { className: "tag warn", textContent: `≈ ${g.score.toFixed(2)}` })),
        ...g.members.map((m) => {
          const a = byKey.get(artifactKey(m));
          return el("div", { className: "member" },
            el("button", { type: "button", className: "name link", textContent: a.name, onclick: () => select(a) }),
            el("span", { className: "repo-label", textContent: `${m.owner}/${m.repo}` }),
            el("a", { className: "path", href: a.url, target: "_blank", rel: "noopener", textContent: m.path }),
          );
        }),
      ))));
    }

    result.replaceChildren(...nodes);
    result.hidden = false;
    renderPanel();
    filtersBox.hidden = false;

    const warnings = [];
    const bigOrgs = data.orgs.filter((o) => o.truncated).map((o) => o.org);
    if (bigOrgs.length) warnings.push(`Only the ${PAGE_SIZE} most recently pushed repositories of ${bigOrgs.join(", ")} were fetched.`);
    const truncated = data.repos.filter((r) => r.truncated).map((r) => `${r.owner}/${r.repo}`);
    if (truncated.length) warnings.push(`GitHub truncated the file tree of ${truncated.join(", ")}.`);
    if (warnings.length) {
      showStatus("warn", "⚠️", el("span", { textContent: warnings.join(" ") + " Results may be incomplete." }));
    } else {
      statusBox.hidden = true;
    }
  }

  async function scan() {
    scanning = true;
    button.disabled = addButton.disabled = true;
    result.hidden = true;
    const label = orgs.length === 1 ? orgs[0] : `${orgs.length} organizations`;
    showStatus("", el("div", { className: "spinner" }), el("span", { textContent: `Scanning ${label}…` }));

    const params = new URLSearchParams(orgs.map((o) => ["org", o]));
    history.replaceState(null, "", "?" + params);
    syncFilterToUrl();
    try { localStorage.setItem("skill-atlas:last", JSON.stringify({ orgs })); } catch {}

    try {
      const res = await fetch("api/org-scan?" + params);
      const body = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      render(body);
    } catch (e) {
      showStatus("error", "⛔", el("span", { textContent: e.message }));
    } finally {
      scanning = false;
      addButton.disabled = false;
      renderChips();
    }
  }

  // Enter with text in the field adds it; Enter on an empty field submits the form (scan).
  orgInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && orgInput.value.trim()) { e.preventDefault(); addFromInput(); }
  });
  // Scan: text left in the field is added to the list first.
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const value = orgInput.value.trim();
    if (value && !addOrg(value)) return;
    orgInput.value = "";
    renderChips();
    if (orgs.length) scan();
  });
  addButton.addEventListener("click", addFromInput);
  orgInput.addEventListener("input", renderChips);

  filterInput.addEventListener("input", () => {
    syncFilterToUrl();
    if (lastData) renderGroups();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && selected) select(null);
  });
  starredButton.addEventListener("click", () => {
    setStarredOnly(!starredOnly);
    syncFilterToUrl();
    if (lastData) renderGroups();
  });

  // Prefill from ?org=a&org=b&q=&starred=1 (shareable link) or the last scan.
  const qs = new URLSearchParams(location.search);
  filterInput.value = qs.get("q") || "";
  setStarredOnly(qs.get("starred") === "1");
  loadStars();
  if (qs.getAll("org").length) {
    qs.getAll("org").forEach(addOrg);
    if (orgs.length) scan();
  } else {
    try {
      // Scans of repository lists ({ repos }) from earlier versions are not carried over.
      (JSON.parse(localStorage.getItem("skill-atlas:last") || "null")?.orgs || []).forEach(addOrg);
    } catch {}
  }
  renderChips();
</script>
</body>
</html>
