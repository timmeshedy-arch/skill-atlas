<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Atlas</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #37352f;
    --muted: #787774;
    --faint: #9b9a97;
    --border: #e9e9e7;
    --hover: #f7f7f5;
    --input: #fbfbfa;
    --accent: #2383e2;
    --accent-hover: #0f6fca;
    --ok-bg: #dbeddb;   --ok-fg: #1c3829;
    --bad-bg: #ffe2dd;  --bad-fg: #5d1715;
    --warn-bg: #fdecc8; --warn-fg: #402c1b;
    --code-bg: rgba(135, 131, 120, .15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919;
      --text: #d4d4d4;
      --muted: #9b9b9b;
      --faint: #7f7f7f;
      --border: #2f2f2f;
      --hover: #252525;
      --input: #202020;
      --ok-bg: #2b593f;   --ok-fg: #d8f0e0;
      --bad-bg: #6e3630;  --bad-fg: #ffe2dd;
      --warn-bg: #59441f; --warn-fg: #fdecc8;
      --code-bg: rgba(135, 131, 120, .25);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 760px; margin: 0 auto; padding: 72px 16px 96px; }

  .icon { font-size: 56px; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 36px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
  .subtitle { color: var(--muted); margin: 0 0 32px; }

  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input {
    font: inherit;
    color: inherit;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--faint); }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(35, 131, 226, .15); }
  #repo { flex: 1 1 320px; min-width: 0; }
  #ref { flex: 0 1 140px; min-width: 0; }
  button {
    font: inherit;
    font-weight: 500;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    padding: 7px 16px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: default; }

  .callout {
    display: flex; gap: 10px;
    margin-top: 24px;
    padding: 12px 16px;
    border-radius: 6px;
    background: var(--hover);
  }
  .callout.error { background: var(--bad-bg); color: var(--bad-fg); }
  .callout.warn { background: var(--warn-bg); color: var(--warn-fg); }

  .meta {
    margin-top: 40px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px;
    display: flex; flex-wrap: wrap; gap: 4px 12px;
  }
  .meta a { color: inherit; }
  code {
    font: 85% ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--code-bg);
    color: #eb5757;
    border-radius: 4px;
    padding: 1px 4px;
  }

  h2 {
    font-size: 14px; font-weight: 600;
    color: var(--muted);
    margin: 32px 0 4px;
    display: flex; align-items: center; gap: 6px;
  }
  h2 .count { color: var(--faint); font-weight: 400; }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    padding: 10px 8px;
    margin: 0 -8px;
    border-radius: 6px;
    transition: background .1s;
  }
  li:hover { background: var(--hover); }
  li + li { border-top: 1px solid var(--border); }
  li:hover + li, li:hover { border-top-color: transparent; }
  .row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name { font-weight: 600; }
  .name.missing { color: var(--faint); font-weight: 400; font-style: italic; }
  .tag {
    font-size: 12px;
    padding: 0 6px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .tag.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .tag.bad { background: var(--bad-bg); color: var(--bad-fg); }
  .desc {
    margin: 2px 0 0;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
    cursor: pointer;
  }
  .desc.open { -webkit-line-clamp: unset; }
  .path {
    display: inline-block;
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    word-break: break-all;
  }
  .path:hover { color: var(--text); text-decoration: underline; }
  .empty { color: var(--faint); padding: 8px 0; font-size: 14px; }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--muted);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex: none; align-self: center;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="icon">🗺️</div>
  <h1>Skill Atlas</h1>
  <p class="subtitle">Claude Code skills and slash commands defined in a GitHub repository.</p>

  <form id="form" autocomplete="off">
    <input id="repo" name="repo" placeholder="owner/repo or https://github.com/owner/repo" required autofocus>
    <input id="ref" name="ref" placeholder="branch / tag / sha">
    <button id="scan" type="submit">Scan</button>
  </form>

  <div id="status" class="callout" hidden></div>
  <section id="result" hidden></section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const form = $("form"), repoInput = $("repo"), refInput = $("ref");
  const button = $("scan"), statusBox = $("status"), result = $("result");

  const GROUPS = [
    { type: "SKILL", title: "Skills" },
    { type: "COMMAND", title: "Commands" },
  ];

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    node.append(...children.filter((c) => c != null));
    return node;
  }

  function showStatus(kind, ...content) {
    statusBox.className = "callout" + (kind ? " " + kind : "");
    statusBox.replaceChildren(...content);
    statusBox.hidden = false;
  }

  function renderArtifact(a) {
    const name = a.name
      ? el("span", { className: "name", textContent: a.name })
      : el("span", { className: "name missing", textContent: "unnamed" });
    const tag = a.valid
      ? el("span", { className: "tag ok", textContent: "valid" })
      : el("span", { className: "tag bad", textContent: a.error || "invalid" });
    return el("li", {},
      el("div", { className: "row" }, name, tag),
      a.description ? el("p", {
        className: "desc",
        textContent: a.description,
        title: "Click to expand",
        onclick: (e) => e.currentTarget.classList.toggle("open"),
      }) : null,
      el("a", { className: "path", href: a.url, target: "_blank", rel: "noopener", textContent: a.path }),
    );
  }

  function render(data) {
    const base = `https://github.com/${data.owner}/${data.repo}`;
    const total = data.artifacts.length;
    const valid = data.artifacts.filter((a) => a.valid).length;

    const nodes = [
      el("div", { className: "meta" },
        el("a", { href: `${base}/tree/${data.sha}`, target: "_blank", rel: "noopener", textContent: `${data.owner}/${data.repo}` }),
        el("span", {}, "@ ", el("code", { textContent: data.ref })),
        el("span", { textContent: data.sha.slice(0, 7) }),
        el("span", { textContent: `${total} found · ${valid} valid · ${total - valid} invalid` }),
      ),
    ];

    for (const g of GROUPS) {
      const items = data.artifacts.filter((a) => a.type === g.type);
      nodes.push(el("h2", {}, g.title, el("span", { className: "count", textContent: items.length })));
      nodes.push(items.length
        ? el("ul", {}, ...items.map(renderArtifact))
        : el("div", { className: "empty", textContent: `No ${g.title.toLowerCase()} found.` }));
    }

    result.replaceChildren(...nodes);
    result.hidden = false;

    if (data.truncated) {
      showStatus("warn", "⚠️", el("span", { textContent: "GitHub truncated the file tree — results may be incomplete for very large repositories." }));
    } else {
      statusBox.hidden = true;
    }
  }

  async function scan(repo, ref) {
    button.disabled = true;
    result.hidden = true;
    showStatus("", el("div", { className: "spinner" }), el("span", { textContent: `Scanning ${repo}…` }));

    const params = new URLSearchParams({ repo });
    if (ref) params.set("ref", ref);
    history.replaceState(null, "", "?" + params);
    try { localStorage.setItem("skill-atlas:last", JSON.stringify({ repo, ref })); } catch {}

    try {
      const res = await fetch("api/scan?" + params);
      const body = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      render(body);
    } catch (e) {
      showStatus("error", "⛔", el("span", { textContent: e.message }));
    } finally {
      button.disabled = false;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const repo = repoInput.value.trim();
    if (repo) scan(repo, refInput.value.trim());
  });

  // Prefill from ?repo=&ref= (shareable link) or the last scan.
  const qs = new URLSearchParams(location.search);
  if (qs.get("repo")) {
    repoInput.value = qs.get("repo");
    refInput.value = qs.get("ref") || "";
    scan(repoInput.value, refInput.value);
  } else {
    try {
      const last = JSON.parse(localStorage.getItem("skill-atlas:last") || "null");
      if (last) { repoInput.value = last.repo || ""; refInput.value = last.ref || ""; }
    } catch {}
  }
</script>
</body>
</html>
