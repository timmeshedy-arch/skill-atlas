# JDK для сборки берётся из PATH/JAVA_HOME: локально — jenv, на CI — actions/setup-java.
#
# org.gradle.java.home здесь намеренно НЕ фиксируется: захардкоженный локальный путь
# ломает сборку на любой другой машине, включая CI-раннеры.
#
# Ловушка: Homebrew-овский бинарь `gradle` стартует под своим JDK (26.x), чью версию
# не разбирает JavaVersion.parse из бандленного в Kotlin-плагин IntelliJ — сборка падает
# с IllegalArgumentException. Собирай через ./gradlew.
org.gradle.caching=true
